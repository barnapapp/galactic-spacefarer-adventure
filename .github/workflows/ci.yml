name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Debug CAP
        run: |
          node -v
          npm -v
          npm ls @sap/cds
          npm ls @sap/cds-dk || true
          ls -la node_modules/.bin | grep cds || true

      - name: Deploy database
        run: npx cds deploy --to sqlite

      - name: Run tests
        run: npm run test:mocha -- --timeout 30000