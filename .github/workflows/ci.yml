name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install CAP CDS-DK
        run: npm install -g @sap/cds-dk

      - name: Build CAP (safe mode)
        run: cds build --production --for nodejs

      - name: Start CAP backend
        run: nohup cds run > cds.log 2>&1 &

      - name: Wait for backend
        run: npx wait-on http://localhost:4004

      - name: Run tests
        run: npm run test:mocha -- --timeout 30000